<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Apex Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Literata:opsz,wght@7..72,600&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="rail">
      <div class="rail-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Apex Console</span>
        </div>
        <span class="demo-chip" id="demo-chip" hidden>Demo data</span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="rail-foot">
        <div class="eyebrow" id="theme-label">Theme</div>
        <div class="seg seg-sm" id="theme-toggle" role="group" aria-labelledby="theme-label"></div>
        <p class="rail-meta" id="rail-meta"></p>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1">
      <div id="view" class="view" aria-busy="true"></div>
    </main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
